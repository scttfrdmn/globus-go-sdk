name: Security Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 0'  # Run weekly
  workflow_dispatch:  # Allow manual triggering

jobs:
  gosec:
    name: GoSec Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install gosec
        # Pin to a version compatible with the Go toolchain above; gosec@latest
        # raises its Go floor over time and breaks the install.
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.22.0
        continue-on-error: true  # tooling install issues shouldn't fail the job

      - name: Run gosec
        run: |
          gosec -fmt=json -out=gosec-results.json ./...
        continue-on-error: true  # Don't fail the build yet

      - name: Check gosec results
        run: |
          if [ ! -f gosec-results.json ]; then
            echo "gosec did not produce results (install/scan skipped); nothing to check"
            exit 0
          fi
          ISSUES=$(jq '.Issues | length' gosec-results.json)
          if [ "$ISSUES" -gt 0 ]; then
            echo "GoSec found $ISSUES potential security issues (advisory)"
          else
            echo "No security issues found by GoSec"
          fi
          
  nancy:
    name: Nancy Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install Nancy
        run: |
          curl -sSfL https://raw.githubusercontent.com/sonatype-nexus-community/nancy/main/scripts/install-nancy.sh | sh -s -- -b $(go env GOPATH)/bin
        continue-on-error: true

      - name: Run Nancy
        run: |
          go list -json -m all | nancy sleuth
        continue-on-error: true  # advisory; ci.yml runs the gating security checks
          
  gitleaks:
    name: Gitleaks Secrets Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Install Gitleaks
        run: |
          wget https://github.com/zricethezav/gitleaks/releases/download/v8.8.8/gitleaks_8.8.8_linux_x64.tar.gz
          tar -xzf gitleaks_8.8.8_linux_x64.tar.gz
          chmod +x gitleaks
          sudo mv gitleaks /usr/local/bin/
          
      # Uses the repo's .gitleaks.toml (default rules + a tight allowlist for
      # known false positives: the public client-ID UUID and doc placeholders).
      # gitleaks exits non-zero only when non-allowlisted secrets are found, so
      # we rely on its exit code rather than the mere presence of a report.
      - name: Run Gitleaks
        run: |
          gitleaks detect \
            --config .gitleaks.toml \
            --report-format json \
            --report-path gitleaks-report.json \
            --redact
          echo "No non-allowlisted secrets found by Gitleaks"

      - name: Upload Gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: ignore