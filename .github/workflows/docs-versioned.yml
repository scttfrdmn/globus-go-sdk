name: Build and Deploy Versioned Documentation

on:
  push:
    branches:
      - main
    tags:
      - v*
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (format: v0.x.y or "latest")'
        required: true
        default: 'latest'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: "0.111.3"
          extended: true

      - name: Setup Go
        uses: actions/setup-go@v3
        with:
          go-version: "1.20"

      - name: Determine version
        id: version
        run: |
          # Set default version path
          VERSION_PATH="latest"
          
          # If triggered by tag
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
            VERSION_PATH=${VERSION}
            echo "Building for tagged version: $VERSION"
          # If triggered manually with specific version
          elif [[ "${{ github.event.inputs.version }}" != "" && "${{ github.event.inputs.version }}" != "latest" ]]; then
            VERSION="${{ github.event.inputs.version }}"
            VERSION_PATH=${VERSION}
            echo "Building for specified version: $VERSION"
          # Otherwise build for latest
          else
            VERSION="latest"
            echo "Building for latest version"
          fi
          
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "VERSION_PATH=$VERSION_PATH" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_path=$VERSION_PATH" >> $GITHUB_OUTPUT

      - name: Update config for version
        run: |
          # Update config to mark the current version as selected
          if [[ -f "docs-site/config/_default/config.toml" ]]; then
            sed -i -e 's/selected = true/selected = false/g' docs-site/config/_default/config.toml
            
            if [[ "$VERSION" == "latest" ]]; then
              sed -i -e 's/{ version = "main", path = "\/developer-tools\/go-sdk\/latest" }/{ version = "main", path = "\/developer-tools\/go-sdk\/latest", selected = true }/g' docs-site/config/_default/config.toml
            else
              sed -i -e "s/{ version = \"$VERSION\", path = \"\/developer-tools\/go-sdk\/$VERSION\" }/{ version = \"$VERSION\", path = \"\/developer-tools\/go-sdk\/$VERSION\", selected = true }/g" docs-site/config/_default/config.toml
            fi
          fi
          
          # Add version to baseURL
          sed -i -e "s|baseURL = \"https://docs.globus.org/developer-tools/go-sdk/\"|baseURL = \"https://docs.globus.org/developer-tools/go-sdk/$VERSION_PATH/\"|g" docs-site/config/_default/config.toml

      - name: Generate API docs
        run: |
          go install github.com/princjef/gomarkdoc/cmd/gomarkdoc@latest
          mkdir -p docs-site/content/docs/reference/api
          gomarkdoc --output docs-site/content/docs/reference/api/{{.Dir}}.md ./pkg/...

      - name: Build documentation
        run: |
          cd docs-site
          hugo --minify --baseURL "https://docs.globus.org/developer-tools/go-sdk/$VERSION_PATH/"

      - name: Upload documentation artifact
        uses: actions/upload-artifact@v3
        with:
          name: documentation-${{ steps.version.outputs.version }}
          path: docs-site/public/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs-site/public
          destination_dir: developer-tools/go-sdk/${{ env.VERSION_PATH }}
          keep_files: true