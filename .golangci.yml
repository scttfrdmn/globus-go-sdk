version: "2"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell

  settings:
    errcheck:
      check-type-assertions: true
    misspell:
      locale: US

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
    paths:
      - vendor
      - ".*\\.pb\\.go$"
      - ".*\\.gen\\.go$"

run:
  timeout: 5m
  tests: true
  build-tags:
    - integration
